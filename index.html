<title>Family Nutrition Planner v9</title>
<style>
:root{--bg:#080c12;--card:#111822;--card2:#151f2b;--card3:#0d141d;--ink:#edf3f7;--muted:#9aa9b7;--line:#263343;--accent:#55d6b0;--blue:#74a7ff;--purple:#c59cff;--orange:#ffbd6b;--green:#89e285;--red:#ff8178;--shadow:rgba(0,0,0,.35)}

*{box-sizing:border-box}body{margin:0;font-family:Aptos, "SF Pro Text", "Segoe UI", Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(to bottom,var(--bg),rgba(8,12,18,.86));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.title h1{font-size:24px;margin:0;font-weight:680;letter-spacing:-.02em}.subtitle{color:var(--muted);font-size:13px;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tab,.small{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:9px 13px;font-weight:650;cursor:pointer}.tab.active,.small.primary{background:var(--accent);border-color:var(--accent);color:#06241d}.ghost{background:transparent}.container{max-width:1180px;margin:auto;padding:22px 18px 60px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.span12{grid-column:span 12}.span6{grid-column:span 6}.span4{grid-column:span 4}.span3{grid-column:span 3}@media(max-width:800px){.span6,.span4,.span3{grid-column:span 12}.top{align-items:flex-start;flex-direction:column}}
.card{background:var(--card);border:1px solid var(--line);box-shadow:0 12px 35px var(--shadow);border-radius:22px;padding:18px}.soft{background:var(--card3)}h2,h3{margin:0 0 7px;font-weight:650;letter-spacing:-.015em}.muted{color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:650;color:var(--muted);margin:2px}.pill.blue{color:var(--blue);border-color:rgba(116,167,255,.35)}.pill.purple{color:var(--purple);border-color:rgba(197,156,255,.35)}.pill.orange{color:var(--orange);border-color:rgba(255,189,107,.35)}.pill.green{color:var(--green);border-color:rgba(137,226,133,.35)}
.weekbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.weektitle{font-size:23px;font-weight:700}.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.daybtn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:16px;padding:12px 6px;font-weight:700;cursor:pointer}.daybtn.active{background:var(--accent);border-color:var(--accent);color:#06241d}.daybtn span{display:block;font-size:11px;margin-top:4px;opacity:.75}.training{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.training select,input,textarea{width:100%;background:var(--card3);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:10px;margin:5px 0 10px;font:inherit}textarea{resize:vertical}.meal{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}.meal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meal-type{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:650}.meal-title{font-size:19px;font-weight:650;margin-top:3px;letter-spacing:-.01em}.meal-desc{font-size:14px;color:var(--muted);line-height:1.45;margin-top:6px;max-width:780px}.base{background:var(--card3);border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px}.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}.lane{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px}.lane h4{margin:0 0 8px}.lane ul{margin:0;padding-left:18px}.lane li{margin:7px 0;color:var(--muted);font-size:13px}.portion{color:var(--ink);font-weight:650}.checkline{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.week-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:13px;cursor:pointer}.week-card.active{border-color:var(--accent)}.mini-meal{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}.mini-meal:first-of-type{border-top:0}.meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.box ul{margin:8px 0 0;padding-left:20px}.member-card{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}@media(max-width:900px){.member-card{grid-template-columns:1fr}}.profile-head{display:flex;justify-content:space-between;gap:8px}.portion-table{width:100%;border-collapse:collapse;font-size:13px}.portion-table th,.portion-table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.portion-table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.drawer{position:fixed;inset:0;display:none;z-index:50}.drawer.show{display:block}.shade{position:absolute;inset:0;background:rgba(0,0,0,.55)}.panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--line);padding:18px;overflow:auto}.option{width:100%;text-align:left;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:16px;padding:13px;margin:8px 0;cursor:pointer}.aiPrompt{white-space:pre-wrap;background:var(--card3);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--muted);font-size:13px;max-height:280px;overflow:auto}

/* v5 calmer visual system */
body{line-height:1.45;-webkit-font-smoothing:antialiased}
.container{padding-top:18px}
.card{box-shadow:0 8px 24px var(--shadow);border-radius:24px}
.tab,.small{font-weight:600;padding:8px 12px}
.weektitle{font-weight:650;font-size:21px}
.daybtn{font-weight:620;padding:10px 6px;border-radius:15px}
.today-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.today-actions{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.training-pop{position:relative}
.training-pop summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:8px 12px;font-weight:600;color:var(--ink)}
.training-pop summary::-webkit-details-marker{display:none}
.training-panel{position:absolute;right:0;top:42px;width:min(360px,calc(100vw - 36px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 18px 50px var(--shadow);z-index:30}
.training{grid-template-columns:1fr;gap:6px}
.meal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.meal{margin-bottom:0;padding:14px;border-radius:20px;min-height:0}
.meal-head{align-items:flex-start}
.meal-desc{font-size:13px;line-height:1.4;max-width:none;margin-top:5px}
.base{padding:10px;margin-top:10px;border-radius:14px}
.base .muted{font-size:12.5px}
.lanes{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.lane{padding:10px;border-radius:14px}
.lane h4{font-size:13px;font-weight:650;margin-bottom:5px}
.lane ul{padding-left:15px}
.lane li{font-size:12.3px;line-height:1.35;margin:5px 0}
.pill{font-weight:600;font-size:11.5px;padding:4px 8px}
.checkline{margin-top:10px;font-size:12.5px}
@media(max-width:980px){.meal-grid{grid-template-columns:1fr}.lanes{grid-template-columns:1fr}.today-head{flex-direction:column}.today-actions{justify-content:flex-start}}

/* v6 visual clean-up */
header{background:rgba(8,12,18,.88);box-shadow:none;border-bottom:1px solid var(--line)}
body.light header{background:rgba(246,243,236,.94);backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(90,75,55,.08);border-bottom:1px solid rgba(222,213,198,.78)}
body.light .top{filter:none}
select.small-select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:8px 34px 8px 13px;font:inherit;font-weight:600;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.today-head.compact{align-items:center;margin-bottom:10px}
.today-head.compact h2{margin:0;font-size:22px;font-weight:640}
.today-actions{align-items:center}
.training-pop summary,.tab,.small,select.small-select{box-shadow:none}
body.light .tab,body.light .small,body.light select.small-select,body.light .training-pop summary{background:#f4efe5}
body.light .tab.active,body.light .small.primary{background:var(--accent)}
.today-meta{display:none}
@media(max-width:980px){.today-head.compact{flex-direction:row}.today-actions{justify-content:flex-end}}
@media(max-width:620px){.today-head.compact{align-items:flex-start;flex-direction:column}.today-actions{justify-content:flex-start}}


/* v7 refined meal cards */
.meal-grid{grid-auto-rows:1fr;align-items:stretch}
.meal{position:relative;display:flex;flex-direction:column;gap:0;padding:18px 16px 14px;min-height:360px;transition:border-color .18s ease, background .18s ease, opacity .18s ease;overflow:hidden}
.meal.completed{border-color:rgba(137,226,133,.45);background:linear-gradient(180deg,var(--card),var(--card3))}
.meal.completed::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);opacity:.75}
.meal-actions{position:absolute;top:14px;right:14px;display:flex;gap:8px;align-items:center;z-index:2}
.icon-btn{width:28px;height:28px;border:1px solid var(--line);background:var(--card2);color:var(--muted);border-radius:999px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;line-height:1;font-weight:500;transition:background .15s ease,color .15s ease,border-color .15s ease,transform .15s ease}
.icon-btn:hover{color:var(--ink);border-color:var(--accent);transform:translateY(-1px)}
.done-btn{font-size:15px}
.meal.completed .done-btn{background:rgba(137,226,133,.12);border-color:rgba(137,226,133,.55);color:var(--green)}
.meal-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600;margin-right:72px}
.meal-title{font-size:18px;font-weight:620;letter-spacing:-.012em;margin-top:6px;margin-right:72px;line-height:1.2}
.meal-desc{font-size:13px;line-height:1.42;color:var(--muted);margin-top:7px;margin-right:20px;min-height:37px}
.tagrow{margin-top:11px;min-height:28px}
.pill{font-size:10.8px;padding:3px 7px;font-weight:560}
.compact-lanes{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px;flex:1;align-items:stretch}
.compact-lane{background:transparent;border:0;border-radius:0;padding:0 8px 0 0;min-width:0}
.compact-lane:not(:last-child){border-right:1px solid var(--line)}
.compact-lane h4{font-size:12px;font-weight:620;margin:0 0 6px;color:var(--ink)}
.compact-lane ul{padding-left:15px;margin:0}
.compact-lane li{font-size:12px;line-height:1.32;margin:5px 0;color:var(--muted)}
.meal.completed .meal-title,.meal.completed .meal-desc{opacity:.78}
@media(max-width:980px){.meal{min-height:auto}.compact-lanes{grid-template-columns:1fr}.compact-lane:not(:last-child){border-right:0;border-bottom:1px solid var(--line);padding-bottom:8px}.meal-desc{min-height:auto}}

/* v7.1 completed state + cleaner week navigation */
.meal.completed{border-color:rgba(154,169,183,.25);background:var(--card3);box-shadow:none}
.meal.completed::before{display:none}
.meal.completed .meal-kicker,
.meal.completed .meal-title,
.meal.completed .meal-desc,
.meal.completed .tagrow,
.meal.completed .compact-lanes{opacity:.42;filter:grayscale(.75)}
.meal.completed .done-btn{background:var(--card2);border-color:rgba(154,169,183,.38);color:var(--muted)}
.meal.completed .done-btn:hover{color:var(--ink);border-color:var(--accent)}
.weekbar{justify-content:center;gap:18px;margin-bottom:4px}
.weektitle{font-weight:620;font-size:18px;min-width:86px;text-align:center}
.week-arrow{border:0;background:transparent;color:var(--muted);font-size:28px;line-height:1;padding:4px 10px;border-radius:999px;cursor:pointer;font-weight:300}
.week-arrow:hover{color:var(--ink);background:var(--card2)}
.today-actions .small-select{display:none}


/* v7.2 locked Today tab */
.week-shell{position:relative;padding:14px 18px 16px}
.weekbar{margin:0 0 10px}
.weektitle{font-size:17px;font-weight:560;letter-spacing:-.01em;color:var(--ink);min-width:118px}
.week-arrow{font-size:30px;padding:2px 10px;color:var(--muted);font-weight:250;background:transparent}
.week-arrow:hover{background:transparent;color:var(--ink)}
.days7{margin-top:8px;gap:9px}
.daybtn{padding:10px 6px 9px;border-radius:16px;font-weight:590}
.daybtn span{font-size:12px;margin-top:5px;opacity:.72;font-weight:520}
.today-actions{position:absolute;right:16px;top:12px}
.training-pop summary{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);font-weight:500}
.training-pop summary:hover{color:var(--ink);border-color:var(--accent)}
.training-panel{top:44px}
.today-nav-card{box-shadow:0 6px 18px var(--shadow)}
.meal-grid{margin-top:0}
@media(max-width:680px){.week-shell{padding:14px 12px 15px}.today-actions{right:12px}.days7{gap:6px}.daybtn{font-size:12px;padding:9px 4px}.daybtn span{font-size:10.5px}.weektitle{font-size:15px}.week-arrow{font-size:26px;padding:2px 7px}}

/* v8 cross-browser design system */
:root{
  --bg:#080c12;--card:#111822;--card2:#151f2b;--card3:#0d141d;--ink:#edf3f7;--muted:#9aa9b7;--line:#263343;
  --accent:#55d6b0;--accent-ink:#06241d;--blue:#74a7ff;--purple:#c59cff;--orange:#ffbd6b;--green:#89e285;--red:#ff8178;
  --font-sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --shadow-color:rgba(0,0,0,.35);--shadow-card:0 8px 24px var(--shadow-color);--shadow-popover:0 18px 50px var(--shadow-color);
  --radius-pill:999px;--radius-sm:12px;--radius-md:16px;--radius-lg:20px;--radius-xl:24px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;
  --icon-sm:16px;--icon-md:18px;--icon-lg:20px;--icon-btn:28px;--icon-btn-lg:36px;
  --focus-ring:0 0 0 3px rgba(85,214,176,.28)
}
body.light{
  --bg:#f6f3ec;--card:#fffdf7;--card2:#f1ece2;--card3:#faf7ef;--ink:#202a34;--muted:#6f7b86;--line:#ded5c6;
  --shadow-color:rgba(45,35,20,.12)
}
body{font-family:var(--font-sans)}
.card{box-shadow:var(--shadow-card);border-radius:var(--radius-xl)}
.tab,.small,.daybtn,.week-card,.option,.training-pop summary,.icon-btn{
  -webkit-tap-highlight-color:transparent;
  transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .15s ease,opacity .15s ease
}
.tab:focus-visible,.small:focus-visible,.daybtn:focus-visible,.week-card:focus-visible,.option:focus-visible,.training-pop summary:focus-visible,.icon-btn:focus-visible,.week-arrow:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{
  outline:0;box-shadow:var(--focus-ring)
}
select:not(.small-select){
  width:100%;appearance:none;-webkit-appearance:none;background-color:var(--card3);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--radius-sm);padding:10px 34px 10px 10px;margin:5px 0 10px;font:inherit;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat
}
.icon{width:var(--icon-sm);height:var(--icon-sm);display:block;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:0 0 auto}
.icon-btn{width:var(--icon-btn);height:var(--icon-btn);padding:0;border-radius:var(--radius-pill);font-size:0}
.icon-btn:hover,.icon-btn:focus-visible{color:var(--ink);border-color:var(--accent);background:var(--card3)}
.icon-btn:active,.week-arrow:active,.training-pop summary:active{transform:translateY(0)}
.done-btn[aria-pressed="true"]{background:var(--card2);border-color:rgba(154,169,183,.38);color:var(--muted)}
.meal.completed{border-color:rgba(154,169,183,.25);background:var(--card3);box-shadow:none}
.meal.completed .meal-kicker,.meal.completed .meal-title,.meal.completed .meal-desc,.meal.completed .tagrow,.meal.completed .compact-lanes{opacity:.42;filter:grayscale(.75)}
.meal.completed .done-btn{background:var(--card2);border-color:rgba(154,169,183,.38);color:var(--muted)}
.week-arrow{width:var(--icon-btn-lg);height:var(--icon-btn-lg);padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:0;border-radius:var(--radius-pill)}
.week-arrow .icon{width:var(--icon-lg);height:var(--icon-lg);stroke-width:1.7}
.week-arrow:hover,.week-arrow:focus-visible{background:var(--card2);color:var(--ink)}
.training-pop summary{width:var(--icon-btn-lg);height:var(--icon-btn-lg);padding:0}
.training-pop summary .icon{width:var(--icon-md);height:var(--icon-md)}
.training-panel{box-shadow:var(--shadow-popover);border-radius:var(--radius-lg)}
body.light .tab.active,body.light .small.primary,.tab.active,.small.primary,.daybtn.active{color:var(--accent-ink)}
.symptom-panel{position:absolute;top:48px;right:14px;width:min(230px,calc(100% - 28px));background:var(--card2);border:1px solid rgba(154,169,183,.3);border-radius:var(--radius-md);padding:10px;box-shadow:var(--shadow-popover);z-index:3;color:var(--ink);filter:none}
.symptom-title{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:650;margin-bottom:6px}
.symptom-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.symptom-panel select,.symptom-panel input{width:100%;min-width:0;margin:0;background:var(--card3);border:1px solid var(--line);border-radius:10px;color:var(--ink);font:inherit;font-size:12px;padding:7px}
.symptom-panel select{padding:7px 26px 7px 7px}
.symptom-person{grid-column:1/-1}
.symptom-panel input{grid-column:1/-1}
.symptom-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.symptom-saved{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.25}
.symptom-footer .symptom-saved{margin-top:0}
.symptom-ok{padding:6px 10px;font-size:11px;min-width:42px}
.meal.has-symptom-panel .meal-kicker,.meal.has-symptom-panel .meal-title{margin-right:250px}
.insight-stat{display:flex;flex-direction:column;gap:4px;min-height:88px;justify-content:center}
.insight-value{font-size:30px;font-weight:700;letter-spacing:-.02em}
.insight-label{font-size:12px;color:var(--muted);line-height:1.35}
.insight-list{display:grid;gap:8px;margin-top:8px}
.insight-row{display:grid;grid-template-columns:minmax(90px,.8fr) minmax(120px,1fr) minmax(90px,.8fr) minmax(120px,1.2fr);gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.insight-row:first-child{border-top:0}
.insight-row b{font-weight:650}
.insight-empty{padding:18px;border:1px dashed var(--line);border-radius:var(--radius-md);color:var(--muted);background:var(--card3)}
.confidence{display:inline-flex;border:1px solid rgba(255,189,107,.35);border-radius:999px;color:var(--orange);padding:3px 8px;font-size:11px;font-weight:650;margin-left:6px}
.setup-count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.setup-choice{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:var(--radius-md);padding:12px;cursor:pointer;text-align:center;font:inherit;font-weight:650}
.setup-choice.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.setup-card{grid-template-columns:1fr 1fr;align-items:start}

function insightSignals(meal){const m=meal.toLowerCase(),signals=[];[['yogurt',/yogurt/],['cheese',/cheese|mozzarella/],['tomato',/tomato/],['oats',/oat|porridge/],['egg',/egg|omelette/],['salmon',/salmon/],['white fish',/hake|cod/],['prawns',/prawn/],['tuna or bonito',/tuna|bonito/],['rice',/rice/],['potato',/potato/],['quinoa',/quinoa/],['pasta',/pasta/],['bread',/bread|toast|sourdough/],['nuts',/walnut|almond/],['avocado',/avocado/],['berries',/blueberr|strawberr/]].forEach(([label,re])=>{if(re.test(m))signals.push(label)});return signals}
function topSummary(entries,label){return entries.length?entries.slice(0,3).map(([name,count])=>`<div class="insight-row"><b>${escapeHtml(name)}</b><span>${count} ${label}</span><span></span><span></span></div>`).join(''):`<div class="insight-empty">No data yet.</div>`}
function possiblePatterns(logs){const items=[];state.members.forEach(member=>{const mine=logs.filter(log=>log.personId===member.id);countBy(mine,x=>x.symptom).forEach(([symptom,count])=>{if(count>=5)items.push({person:member.name,title:`${symptom} appears repeatedly`,count,detail:`${member.name} logged this ${count} times.`,basis:'person + symptom'})});const combo=[];mine.forEach(log=>insightSignals(log.meal).forEach(signal=>combo.push({signal,symptom:log.symptom})));countBy(combo,x=>x.symptom&&x.signal?`${x.symptom} after ${x.signal}`:'').forEach(([name,count])=>{if(count>=5)items.push({person:member.name,title:name,count,detail:`This meal signal appears in ${count} of ${member.name}'s logs.`,basis:'person + meal signal'})})});return items.sort((a,b)=>b.count-a.count).slice(0,5)}
function renderInsights(){const logs=symptomLogs(),patterns=possiblePatterns(logs),last=logs[0],peopleWithLogs=countBy(logs,x=>x.personName),personRows=state.members.map(member=>{const mine=logs.filter(log=>log.personId===member.id),topSym=countBy(mine,x=>x.symptom)[0],topMeal=countBy(mine,x=>x.meal)[0];return `<div class="insight-row"><div><b>${escapeHtml(member.name)}</b><div class="tiny">${mine.length} symptom logs</div></div><div>${topSym?`${escapeHtml(topSym[0])} · ${topSym[1]}`:'No symptoms logged'}</div><div>${topMeal?`${escapeHtml(topMeal[0])} · ${topMeal[1]}`:'No meal signal yet'}</div><div>${mine[0]?`${ddmm(mine[0].day)} · ${escapeHtml(mine[0].symptom||'Symptom not set')}`:'No latest entry'}</div></div>`}).join(''),logRows=logs.length?logs.map(log=>`<div class="insight-row"><div><b>${escapeHtml(log.personName)}</b><div class="tiny">${ddmm(log.day)} · ${mealLabels[log.type]||log.type}</div></div><div><b>${escapeHtml(log.meal)}</b><div class="tiny">${insightSignals(log.meal).map(escapeHtml).join(' · ')||'No signal tags'}</div></div><div>${escapeHtml(log.delay||'Timing not set')}</div><div><b>${escapeHtml(log.symptom||'Symptom not set')}</b>${log.note?`<div class="tiny">${escapeHtml(log.note)}</div>`:''}</div></div>`).join(''):`<div class="insight-empty">No symptom logs yet. Complete a meal, choose the affected profile, then add timing and symptom details.</div>`;return `<div class="grid"><div class="span12 card"><h2>Health Insights</h2><div class="muted">Symptom signals by profile. Pattern hints appear only after one person has repeated logs in the same direction.</div></div><div class="span3 card insight-stat"><div class="insight-value">${logs.length}</div><div class="insight-label">Total symptom logs</div></div><div class="span3 card insight-stat"><div class="insight-value">${peopleWithLogs.length}</div><div class="insight-label">Profiles with symptoms</div></div><div class="span3 card insight-stat"><div class="insight-value">${peopleWithLogs[0]?.[0]?escapeHtml(peopleWithLogs[0][0]):'—'}</div><div class="insight-label">Most logged profile${peopleWithLogs[0]?.[1]?` · ${peopleWithLogs[0][1]} logs`:''}</div></div><div class="span3 card insight-stat"><div class="insight-value">${last?ddmm(last.day):'—'}</div><div class="insight-label">Latest entry</div></div><div class="span12 card"><h3>By profile</h3><div class="muted">Each person is summarized independently.</div><div class="insight-list">${personRows}</div></div><div class="span12 card"><h3>Possible patterns</h3><div class="muted">${logs.length<5?'Keep logging. Pattern discovery starts after about five matching entries for the same person.':'Cautious person-specific signals only, not medical conclusions.'}</div><div class="insight-list">${patterns.length?patterns.map(p=>`<div class="insight-row"><b>${escapeHtml(p.person)}<span class="confidence">${p.count} logs</span></b><span>${escapeHtml(p.title)}</span><span>${escapeHtml(p.basis)}</span><span class="muted">${escapeHtml(p.detail)} Possible correlation, not a diagnosis.</span></div>`).join(''):`<div class="insight-empty">No person-specific repeated pattern is strong enough yet. The log below is the useful view for now.</div>`}</div></div><div class="span12 card"><h3>Symptom log</h3><div class="muted">Every row belongs to one selected profile.</div><div class="insight-list">${logRows}</div></div></div>`}

function swapChoices(day,type,current){const week=weekDays().filter(d=>d.day!==day).map(d=>({meal:getMeal(d.day,type),sourceDay:d.day,source:`${d.dow} ${ddmm(d.day)}`})).filter(x=>x.meal!==current),seen=new Set(week.map(x=>x.meal));const pool=MEAL_POOL[type].filter(x=>x!==current&&!seen.has(x)).map(meal=>({meal,sourceDay:'',source:'Meal library'}));return week.concat(pool)}
function openSwap(day,type){swapContext={day,type};const current=getMeal(day,type),choices=swapChoices(day,type,current);document.getElementById('drawerTitle').textContent='Swap '+mealLabels[type];document.getElementById('swapOptions').innerHTML=choices.map(x=>`<button class="option" data-choice="${x.meal.replace(/"/g,'&quot;')}" data-source-day="${x.sourceDay}"><b>${x.meal}</b><div class="tiny">${x.sourceDay?`Swap with ${escapeHtml(x.source)}`:escapeHtml(x.source)}</div><div class="meta">${mealDescription(x.meal,type)}</div><div>${inferTags(x.meal).map(t=>`<span class="pill ${t[1]}">${t[0]}</span>`).join('')}</div></button>`).join('');document.getElementById('drawer').classList.add('show');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{swapMeal(swapContext.day,swapContext.type,b.dataset.choice,+b.dataset.sourceDay||0);closeSwap()})}function closeSwap(){document.getElementById('drawer').classList.remove('show');swapContext=null}function escapeHtml(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
